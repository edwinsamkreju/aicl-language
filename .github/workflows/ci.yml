name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,bench]'
      - run: pytest
      - name: Export the deterministic paired benchmark corpus
        run: python benchmarks/generate_suite.py --output /tmp/paired_suite.json
      - name: Run 100-task Python/AICL equivalence benchmark
        run: python benchmarks/run_equivalent_tasks.py --suite /tmp/paired_suite.json --encoding cl100k_base --repeats 20 --json-out benchmark-results.json
      - name: CLI smoke test
        run: |
          aicl check examples/clamp.aicl
          aicl run examples/clamp.aicl --function clamp --args '[15, 0, 10]'
          printf '%s\\n' '{"protocol":"aicl-agent/0.1","op":"inspect","target":"module"}' | aicl agent examples/clamp.aicl
      - name: Upload machine-readable benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: aicl-py100-results-${{ matrix.python-version }}
          path: benchmark-results.json
          if-no-files-found: error
